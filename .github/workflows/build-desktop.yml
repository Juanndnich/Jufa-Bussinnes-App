name: Build & Release Windows Desktop App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build & Release Windows Desktop (Tauri v2)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Compute App Version
        id: versioning
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $majorMinor = ($package.version -split '\.')[0..1] -join '.'
          $versionName = "$majorMinor.${{ github.run_number }}"
          $releaseTag = "v$versionName"
          echo "VERSION_NAME=$versionName" >> $env:GITHUB_ENV
          echo "RELEASE_TAG=$releaseTag" >> $env:GITHUB_ENV
          Write-Host "Version Name: $versionName"
          Write-Host "Release Tag: $releaseTag"

      - name: Build Tauri Desktop Application
        run: npx --yes @tauri-apps/cli@^2 build

      - name: Prepare Windows Installer File
        shell: pwsh
        run: |
          $nsisInstaller = Get-ChildItem -Path "src-tauri\target\release\bundle\nsis" -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nsisInstaller) {
            Copy-Item -Path $nsisInstaller.FullName -Destination "JufaStore-Setup.exe"
            Write-Host "Berhasil menemukan NSIS installer: $($nsisInstaller.FullName)"
          } else {
            $anyExe = Get-ChildItem -Path "src-tauri\target\release" -Filter "jufastore.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($anyExe) {
              Copy-Item -Path $anyExe.FullName -Destination "JufaStore-Setup.exe"
              Write-Host "Menggunakan file binary fallback: $($anyExe.FullName)"
            } else {
              throw "File installer .exe tidak ditemukan di target release"
            }
          }

      - name: Upload Windows Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JufaStore-Windows-Installer
          path: JufaStore-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish Windows Installer to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: JufaStore ${{ env.RELEASE_TAG }} (Rilis Resmi)
          body: |
            ## Pembaruan Resmi JufaStore
            - Versi Rilis: ${{ env.RELEASE_TAG }}
            - Multi-Platform: Android APK (`JufaStore.apk`) & Windows Desktop Installer (`JufaStore-Setup.exe`)
            - Build otomatis dari commit: ${{ github.sha }}
            - Seluruh data bisnis & transaksi tersimpan 100% aman di database lokal perangkat.
          draft: false
          prerelease: false
          files: |
            JufaStore-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
