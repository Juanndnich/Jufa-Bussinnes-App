name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Add Capacitor Android Platform
        run: npx cap add android

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Apply Custom Android App Icon
        run: |
          # Hapus folder adaptive xml anydpi-v26 untuk mencegah error duplicate resource dengan file png
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ]; then
              cp public/app-icon.png "$dir/ic_launcher.png"
              cp public/app-icon.png "$dir/ic_launcher_round.png"
              cp public/app-icon.png "$dir/ic_launcher_foreground.png"
            fi
          done

      - name: Grant Execute Permission for Gradle
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Release APK File
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk JufaStore.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk JUFA-STORE.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JufaStore-Android-APK
          path: JufaStore.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (Auto-Update APK)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: JufaStore v2.0.${{ github.run_number }} (Update Otomatis)
          body: |
            ## Pembaruan Otomatis JufaStore
            - Versi Rilis: v2.0.${{ github.run_number }}
            - Build otomatis dari commit: ${{ github.sha }}
            - File APK siap dipasang langsung di HP Android.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            JufaStore.apk
            JUFA-STORE.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
