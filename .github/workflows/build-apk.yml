name: Build & Release JufaStore (Android & Windows)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.versioning.outputs.release_tag }}
      version_name: ${{ steps.versioning.outputs.version_name }}
      version_code: ${{ steps.versioning.outputs.version_code }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2.1

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Compute App Version
        id: versioning
        run: |
          MAJOR_MINOR=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          VERSION_CODE=$(( ${{ github.run_number }} + 100 ))
          VERSION_NAME="${MAJOR_MINOR}.${{ github.run_number }}"
          RELEASE_TAG="v${VERSION_NAME}"
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "Version Code: ${VERSION_CODE}"
          echo "Version Name: ${VERSION_NAME}"
          echo "Release Tag: ${RELEASE_TAG}"

      - name: Setup Release Keystore
        run: |
          KEYSTORE_FILE="${RUNNER_TEMP}/jufastore-release.jks"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode --ignore-garbage > "$KEYSTORE_FILE" 2>/dev/null || echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_FILE"
          echo "KEYSTORE_PATH=${KEYSTORE_FILE}" >> $GITHUB_ENV

      - name: Grant Execute Permission for Gradle
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Prepare Release APK File
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk JufaStore.apk

      - name: Verify APK Signature & Print SHA-256 Fingerprint
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER="apksigner"
          fi
          echo "Memverifikasi tanda tangan APK..."
          $APKSIGNER verify --verbose --print-certs JufaStore.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JufaStore-Android-APK
          path: JufaStore.apk
          if-no-files-found: error
          retention-days: 30

  build-desktop:
    name: Build Windows Desktop (Tauri v2)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Build Tauri Desktop Application
        run: npx --yes @tauri-apps/cli@^2 build

      - name: Prepare Windows Installer File
        shell: pwsh
        run: |
          $nsisInstaller = Get-ChildItem -Path "src-tauri\target\release\bundle\nsis" -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nsisInstaller) {
            Copy-Item -Path $nsisInstaller.FullName -Destination "JufaStore-Setup.exe"
            Write-Host "Berhasil menemukan NSIS installer: $($nsisInstaller.FullName)"
          } else {
            $anyExe = Get-ChildItem -Path "src-tauri\target\release" -Filter "jufastore.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($anyExe) {
              Copy-Item -Path $anyExe.FullName -Destination "JufaStore-Setup.exe"
              Write-Host "Menggunakan file binary fallback: $($anyExe.FullName)"
            } else {
              throw "File installer .exe tidak ditemukan di target release"
            }
          }

      - name: Upload Windows Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JufaStore-Windows-Installer
          path: JufaStore-Setup.exe
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish Official Release (Android & Windows)
    needs: [build-android, build-desktop]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: JufaStore-Android-APK
          path: ./release-assets

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: JufaStore-Windows-Installer
          path: ./release-assets

      - name: Publish Unified GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-android.outputs.release_tag }}
          name: JufaStore ${{ needs.build-android.outputs.release_tag }} (Rilis Resmi)
          body: |
            ## Pembaruan Resmi JufaStore
            - Versi Rilis: ${{ needs.build-android.outputs.release_tag }} (Android Version Code: ${{ needs.build-android.outputs.version_code }})
            - Multi-Platform: Android APK (`JufaStore.apk`) & Windows Desktop Installer (`JufaStore-Setup.exe`)
            - Ditandatangani resmi (Release Keystore)
            - Build otomatis dari commit: ${{ github.sha }}
            - File APK dapat langsung dipasang atau menimpa versi sebelumnya tanpa copot aplikasi.
            - Seluruh data bisnis & keuangan tersimpan 100% aman di database lokal perangkat Anda.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release-assets/JufaStore.apk
            release-assets/JufaStore-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
