name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Compute App Version
        id: versioning
        run: |
          MAJOR_MINOR=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          VERSION_CODE=$(( ${{ github.run_number }} + 100 ))
          VERSION_NAME="${MAJOR_MINOR}.${{ github.run_number }}"
          RELEASE_TAG="v${VERSION_NAME}"
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV
          echo "Version Code: ${VERSION_CODE}"
          echo "Version Name: ${VERSION_NAME}"
          echo "Release Tag: ${RELEASE_TAG}"

      - name: Setup Release Keystore
        run: |
          KEYSTORE_FILE="${RUNNER_TEMP}/jufastore-release.jks"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_FILE"
          echo "KEYSTORE_PATH=${KEYSTORE_FILE}" >> $GITHUB_ENV

      - name: Grant Execute Permission for Gradle
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Prepare Release APK File
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk JufaStore.apk

      - name: Verify APK Signature & Print SHA-256 Fingerprint
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER="apksigner"
          fi
          echo "Memverifikasi tanda tangan APK..."
          $APKSIGNER verify --verbose --print-certs JufaStore.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JufaStore-Android-APK
          path: JufaStore.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (Auto-Update APK)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: JufaStore ${{ env.RELEASE_TAG }} (Rilis Resmi)
          body: |
            ## Pembaruan Resmi JufaStore
            - Versi Rilis: ${{ env.RELEASE_TAG }} (Version Code: ${{ env.VERSION_CODE }})
            - Ditandatangani resmi (Release Keystore)
            - Build otomatis dari commit: ${{ github.sha }}
            - File APK dapat langsung dipasang atau menimpa versi sebelumnya tanpa copot aplikasi.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            JufaStore.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
