name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Add Capacitor Android Platform
        run: npx cap add android

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission for Gradle
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Release APK File
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk JUFA-STORE.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JUFA-STORE-Android-APK
          path: JUFA-STORE.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (Auto-Update APK)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: JUFA STORE Latest Release
          body: |
            ## Pembaruan Otomatis JUFA STORE Robux Manager
            - Build otomatis dari commit: ${{ github.sha }}
            - File APK siap dipasang langsung di HP Android.
          draft: false
          prerelease: false
          files: JUFA-STORE.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
