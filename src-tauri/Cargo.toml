[package]
name = "jufastore"
version = "2.1.29"
description = "JufaStore Desktop Application"
authors = ["JufaStore"]
edition = "2021"

[lib]
name = "jufastore_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
