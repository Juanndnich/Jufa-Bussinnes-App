<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgSpooky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140727" />
      <stop offset="50%" stop-color="#0a0414" />
      <stop offset="100%" stop-color="#05020a" />
    </linearGradient>
    <linearGradient id="pumpkinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9a3c" />
      <stop offset="40%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="fireGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="glowOrange" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base (Squircle) -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgSpooky)" stroke="#f97316" stroke-opacity="0.35" stroke-width="6" />

  <!-- Moon / Aura Glow behind Pumpkin -->
  <circle cx="256" cy="240" r="160" fill="#f97316" opacity="0.12" filter="url(#glowOrange)" />

  <!-- Flying Bat Silhouettes -->
  <path d="M100,120 Q120,105 130,118 Q140,105 160,120 Q145,128 130,124 Q115,128 100,120 Z" fill="#c084fc" opacity="0.6" />
  <path d="M370,100 Q385,88 393,98 Q400,88 415,100 Q403,106 393,103 Q382,106 370,100 Z" fill="#c084fc" opacity="0.7" />
  <path d="M80,200 Q92,190 98,198 Q105,190 116,200 Q107,205 98,202 Q90,205 80,200 Z" fill="#f97316" opacity="0.4" />

  <!-- Pumpkin Stem -->
  <path d="M246,130 Q248,95 275,90 Q270,105 264,130 Z" fill="#4ade80" />

  <!-- Pumpkin Body Ribs -->
  <ellipse cx="256" cy="255" rx="155" ry="130" fill="url(#pumpkinGrad)" filter="url(#glowOrange)" />
  <ellipse cx="210" cy="255" rx="95" ry="125" fill="#f97316" opacity="0.3" />
  <ellipse cx="302" cy="255" rx="95" ry="125" fill="#f97316" opacity="0.3" />
  <ellipse cx="256" cy="255" rx="55" ry="128" fill="#fb923c" opacity="0.4" />

  <!-- Carved Glowing Jack-o'-Lantern Eyes (Fiery Glow) -->
  <!-- Left Eye -->
  <polygon points="195,200 230,230 185,235" fill="url(#fireGlow)" />
  <!-- Right Eye -->
  <polygon points="317,200 327,235 282,230" fill="url(#fireGlow)" />
  <!-- Nose Triangle -->
  <polygon points="256,238 244,258 268,258" fill="url(#fireGlow)" />

  <!-- Carved Wicked Smile with Teeth -->
  <path d="M180,285 Q256,365 332,285 Q305,315 288,290 Q272,315 256,290 Q240,315 224,290 Q205,315 180,285 Z" fill="url(#fireGlow)" />

  <!-- Floating Golden Robux Coin Overlap on Right -->
  <g transform="translate(290, 150) scale(0.65)">
    <!-- Robux Glow -->
    <polygon points="100,20 180,65 180,155 100,200 20,155 20,65" fill="url(#goldGrad)" opacity="0.35" filter="url(#glowOrange)" />
    <!-- Robux Outer Hexagon -->
    <polygon points="100,30 170,70 170,150 100,190 30,150 30,70" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="4" stroke-opacity="0.6" />
    <!-- Robux Inner Cutout -->
    <polygon points="100,65 140,90 140,130 100,155 60,130 60,90" fill="#0c0714" stroke="url(#goldGrad)" stroke-width="3" />
    <!-- Letter R$ -->
    <text x="100" y="125" font-family="'Poppins', sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle">R$</text>
  </g>

  <!-- Brand Label Bottom -->
  <text x="256" y="420" font-family="'Poppins', sans-serif" font-weight="800" font-size="28" letter-spacing="4" fill="#ffffff" text-anchor="middle">JUFA STORE</text>
  <text x="256" y="445" font-family="'Inter', sans-serif" font-weight="700" font-size="13" letter-spacing="6" fill="#f97316" text-anchor="middle">🎃 HALLOWEEN EDITION</text>
</svg>