<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#141417" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base (Rounded Squircle) -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- Inner Subtle Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#f59e0b" stroke-opacity="0.15" stroke-width="3" stroke-dasharray="8 8" />

  <!-- Outer Glow Hexagon/Coin -->
  <polygon points="256,105 375,174 375,312 256,381 137,312 137,174" fill="url(#goldGrad)" opacity="0.15" filter="url(#glow)" />

  <!-- Main Robux Gold Hexagon -->
  <polygon points="256,120 360,180 360,300 256,360 152,300 152,180" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="4" stroke-opacity="0.4" />

  <!-- Inner Dark Hexagon Cutout -->
  <polygon points="256,170 316,205 316,275 256,310 196,275 196,205" fill="#09090b" stroke="url(#goldGrad)" stroke-width="3" />

  <!-- Letter R and $ symbol inside -->
  <text x="256" y="260" font-family="'Poppins', 'Inter', sans-serif" font-weight="900" font-size="78" fill="#ffffff" text-anchor="middle" dominant-baseline="central">R$</text>

  <!-- Brand Label Bottom -->
  <text x="256" y="420" font-family="'Poppins', sans-serif" font-weight="800" font-size="30" letter-spacing="4" fill="#ffffff" text-anchor="middle">JUFA STORE</text>
  <text x="256" y="445" font-family="'Inter', sans-serif" font-weight="600" font-size="14" letter-spacing="6" fill="#f59e0b" text-anchor="middle">MANAGER</text>
</svg>
